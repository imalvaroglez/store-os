name: CI

# CI/CD pipeline. The Vercel project's "Ignored Build Step" is set to `exit 0`
# (configured in the Vercel dashboard, not in this repo), so Vercel NEVER builds
# on Git push. The ONLY path to a Vercel deployment is the `deploy` job below,
# which runs exclusively after build-test AND rules-and-e2e pass.
#   - Push to a non-main branch → Preview deploy (points at the dev Firebase).
#   - Push to main (merge)        → Production deploy (points at prod Firebase).
# If Vercel ever starts auto-deploying again (new deployments you didn't trigger
# from this workflow), the Ignored Build Step regressed — re-set it to `exit 0`.
# The job-level `environment:` selects which set of VITE_FIREBASE_* secrets
# GitHub injects (Preview environment → dev, Production environment → prod).
on:
  pull_request:
  push:
    # Any branch: feature-branch pushes produce a Preview deploy (after CI);
    # a push to main produces a Production deploy.
    branches: ['**']

jobs:
  # Resolves once per run: "Production" when the merge lands on main, else "Preview".
  # Names match the GitHub environments created in repo Settings (capitalized).
  env-select:
    runs-on: ubuntu-latest
    outputs:
      env-name: ${{ steps.set.outputs.env-name }}
      app-changed: ${{ steps.changes.outputs.app-changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" = "main" ]; then
            echo "env-name=Production" >> "$GITHUB_OUTPUT"
          else
            echo "env-name=Preview" >> "$GITHUB_OUTPUT"
          fi
      - id: changes
        name: Detect documentary-only diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
          elif [ "$REF_NAME" = "main" ]; then
            BASE_SHA="$BEFORE_SHA"
          else
            BASE_SHA="$(git merge-base origin/main "$GITHUB_SHA")"
          fi
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "app-changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          app_changed=false
          while IFS= read -r file; do
            case "$file" in
              docs/*|*.md) ;;
              *) app_changed=true; break ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")
          echo "app-changed=$app_changed" >> "$GITHUB_OUTPUT"

  build-test:
    needs: env-select
    if: needs.env-select.outputs.app-changed == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.env-select.outputs.env-name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Lint (typecheck)
        run: npm run typecheck
      - name: Unit + static gates
        run: npm run test
      - name: Build (${{ needs.env-select.outputs.env-name }})
        run: npm run build
        env:
          VITE_VERCEL_ENV: ${{ needs.env-select.outputs.env-name == 'Production' && 'production' || 'preview' }}
          # check-env.cjs requires the public Firebase config present at build time.
          # Resolved from the active GitHub environment (preview → dev, production → prod).
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_SENDER_ID: ${{ secrets.VITE_FIREBASE_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

  rules-and-e2e:
    needs: env-select
    if: needs.env-select.outputs.app-changed == 'true'
    runs-on: ubuntu-latest
    # Backend tests always exercise the real development project, including on
    # a main push. Production is tested only after the explicit promotion.
    environment: Preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build (${{ needs.env-select.outputs.env-name }} preview for e2e)
        run: npm run build
        env:
          VITE_VERCEL_ENV: preview
          # The default e2e suite serves `npm run preview` (production build,
          # DEV=false) and asserts the AuthScreen renders. Needs the public
          # Firebase config baked in at build time, from the active environment.
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_SENDER_ID: ${{ secrets.VITE_FIREBASE_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - name: Firestore rules tests (store-os-dev)
        run: npm run test:rules
        env:
          VITE_VERCEL_ENV: preview
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_SENDER_ID: ${{ secrets.VITE_FIREBASE_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          FIREBASE_DEV_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_DEV_SERVICE_ACCOUNT_JSON }}
      - name: E2E (Playwright)
        run: npm run e2e
      - name: E2E with Firebase development backend
        run: npm run e2e:dev
        env:
          VITE_VERCEL_ENV: preview
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_SENDER_ID: ${{ secrets.VITE_FIREBASE_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          FIREBASE_DEV_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_DEV_SERVICE_ACCOUNT_JSON }}

  # ───────────────────────────── deploy ──────────────────────────────
  # The ONLY path to a Vercel deployment. Runs only if BOTH gates passed.
  # Vercel's Git auto-deploy is OFF, so without this job nothing publishes.
  deploy:
    needs: [env-select, build-test, rules-and-e2e]
    # Only deploy on push events (a push to a branch, or a merge to main).
    # PR-only synthetic events would double-deploy; the underlying push already
    # triggers this.
    if: github.event_name == 'push' && needs.env-select.outputs.app-changed == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.env-select.outputs.env-name }}
    # The Vercel CLI reads ORG/PROJECT id from .vercel/project.json OR these env
    # vars. The file is gitignored, so we expose both env vars job-wide here
    # AND recreate the file in the first step for maximum robustness.
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    outputs:
      deployment-url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Recreate .vercel/project.json (gitignored, not in checkout)
        run: |
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s","projectName":"store-os"}' \
            "${{ secrets.VERCEL_PROJECT_ID }}" "${{ secrets.VERCEL_ORG_ID }}" > .vercel/project.json
          cat .vercel/project.json
      - run: npm ci
      - name: Install Vercel CLI
        run: npm i -g vercel@latest
      - name: Resolve Vercel target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" = "main" ]; then
            echo "env=production" >> "$GITHUB_OUTPUT"
            echo "vercel_env=production" >> "$GITHUB_OUTPUT"
            echo "prod_flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "env=preview" >> "$GITHUB_OUTPUT"
            echo "vercel_env=preview" >> "$GITHUB_OUTPUT"
            echo "prod_flag=" >> "$GITHUB_OUTPUT"
          fi
      - name: Pull Vercel project config
        run: vercel pull --yes --environment=${{ steps.target.outputs.env }} --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build (Vercel, with Firebase env for check-env.cjs)
        # IMPORTANT: the VITE_FIREBASE_* vars are passed HERE from GitHub
        # environment secrets (Preview=store-os-dev, Production=store-os-f7cf8).
        # Vercel itself holds ZERO VITE_FIREBASE_* env vars — GitHub is the single
        # source of truth, so there is no second source that could override the
        # backend per environment. `vercel build` reads these from the process env.
        run: vercel build ${{ steps.target.outputs.prod_flag }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          # check-env.cjs validates the (VITE_VERCEL_ENV, projectId) pair.
          # VITE_VERCEL_ENV is NOT auto-injected when building outside Vercel,
          # so we set it explicitly so the cross-env guard runs correctly.
          VITE_VERCEL_ENV: ${{ steps.target.outputs.vercel_env }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_SENDER_ID: ${{ secrets.VITE_FIREBASE_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - name: Deploy
        id: deploy
        # `vercel deploy` writes the deployment URL to stdout and trailing
        # hints ("To deploy to production…") to stderr, so we must NOT merge
        # them (the old `2>&1 | tail -n 1` captured the hint, not the URL).
        # Per the CLI docs: stdout is always the Deployment URL. Redirect
        # stdout to a file, stderr to the log; the file holds the URL alone.
        run: |
          set +e
          vercel deploy --prebuilt ${{ steps.target.outputs.prod_flag }} --token=${{ secrets.VERCEL_TOKEN }} > deploy-url.txt 2> deploy-err.txt
          code=$?
          if [ $code -ne 0 ]; then
            echo "vercel deploy failed (exit $code):"
            cat deploy-err.txt
            exit $code
          fi
          URL="$(cat deploy-url.txt | tr -d '[:space:]')"
          echo "Deployed to: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

  # ───────────────────── deploy-rules (anti-drift) ─────────────────────
  # Born from the 2026-08-11 incident: prod ran three-week-old Firestore rules
  # while the repo evolved (rules deploys were a manual DEPLOYMENT.md step and
  # nothing compared deployed vs repo), surfacing as silently-denied
  # public-catalog writes. This job is now the ONLY regular path to a rules
  # deployment: every push to main ships firestore.rules + indexes + storage.rules
  # and the public-order callable to BOTH backends, then verifies rule parity
  # with a second no-op pass.
  deploy-rules:
    needs: [env-select, build-test, rules-and-e2e, deploy]
    # Main only, after the frontend deploy. Dev is a shared backend for all
    # previews, so per-PR rule deploys would mutate it mid-review for other
    # testers; PR rules are already validated against the real dev backend in
    # rules-and-e2e.
    if: github.event_name == 'push' && github.ref_name == 'main' && needs.env-select.outputs.app-changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Firebase CLI
        run: npm i -g firebase-tools
      - name: Deploy rules (prod + dev)
        # FIREBASE_TOKEN: repo-level secret created with `firebase login:ci`
        # (repo Settings → Secrets and variables → Actions).
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          for P in store-os-f7cf8 store-os-dev; do
            echo "── deploying firestore+storage rules → $P"
            firebase deploy --only firestore:rules,firestore:indexes,storage --project "$P" \
              --token "$FIREBASE_TOKEN" --non-interactive
            echo "── deploying callable functions → $P"
            firebase deploy --only functions --project "$P" \
              --token "$FIREBASE_TOKEN" --non-interactive
          done
      - name: Parity check (second pass must be a no-op)
        # This firebase-tools version prints "released rules …" even on a no-op
        # deploy, so "released" is NOT a drift signal. The reliable one is the
        # inverse: an actual change always UPLOADS ("uploading rules …"), while
        # an up-to-date deploy prints "already up to date, skipping upload". If
        # the second pass uploads anything, the first pass didn't stick (or
        # something rewrote the release in between) — that's the drift we fail on.
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          status=0
          for P in store-os-f7cf8 store-os-dev; do
            code=0
            OUT="$(firebase deploy --only firestore:rules,firestore:indexes,storage --project "$P" \
              --token "$FIREBASE_TOKEN" --non-interactive 2>&1)" || code=$?
            echo "$OUT"
            if [ "$code" -ne 0 ]; then
              echo "::error::$P: parity pass failed (exit $code)"
              status=1
            elif grep -qi "uploading rules" <<<"$OUT"; then
              echo "::error::$P: not in parity — the second pass still uploaded rules"
              status=1
            fi
          done
          exit $status

  # Post the preview URL as a comment on the PR (preview only). CLI deploys
  # don't generate branch-alias URLs like the Git integration does, so we
  # surface the deployment URL manually.
  comment-preview-url:
    needs: [env-select, deploy]
    if: needs.env-select.outputs.env-name != 'Production' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # The repo's workflow-permission default is "read and write" (set in
    # repo Settings → Actions → General → Workflow permissions). We still scope
    # this job to the minimum it needs, so the token can't do more than read
    # code + write PR comments even though the repo default is broader.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Find and comment on the PR for this branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: ${{ needs.deploy.outputs.deployment-url }}
        run: |
          set +e
          # gh pr list --head is unreliable in Actions with the auto GITHUB_TOKEN
          # (cli/cli#1314, #4902): it often returns empty even for an open PR.
          # Use the search API, which respects pull-requests:read consistently.
          PR_NUMBER=$(gh api graphql -f query='
            query($headRefName: String!) {
              repository(owner: "${{ github.repository_owner }}", name: "${{ github.event.repository.name }}") {
                pullRequests(headRefName: $headRefName, states: OPEN, first: 1) {
                  nodes { number }
                }
              }
            }' -F headRefName='${{ github.ref_name }}' -q '.data.repository.pullRequests.nodes[0].number')
          if [ -z "$PR_NUMBER" ]; then
            echo "No open PR for branch ${{ github.ref_name }}; skipping comment."
            exit 0
          fi
          BODY=$(printf '🚀 **Preview deploy** para `%s` (CI verde): %s\nApunta al backend de **dev** (store-os-dev). Generado por GitHub Actions tras pasar build-test + rules-and-e2e.' "${{ github.sha }}" "$URL")
          # -R is required because this job has no checkout (no .git for gh to
          # infer the repo from); without it gh pr comment fails with
          # "fatal: not a git repository".
          gh pr comment "$PR_NUMBER" -R "${{ github.repository }}" --body "$BODY" || echo "comment failed (non-fatal)"
          exit 0
