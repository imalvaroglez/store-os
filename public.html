<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Catálogo</title>
    <meta name="description" content="Explora el catálogo, elige tus piezas favoritas y prepara tu pedido por WhatsApp." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <!-- Self-hosted variable fonts (latin): the storefront must not block
         first paint on a cross-origin fonts chain. Preload + swap keeps the
         brand typography without a render-blocking stylesheet. -->
    <link rel="preload" href="/fonts/plus-jakarta-sans-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/playfair-display-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: "Plus Jakarta Sans";
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url("/fonts/plus-jakarta-sans-latin-var.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Playfair Display";
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url("/fonts/playfair-display-latin-var.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
    </style>
  </head>
  <body><div id="root"></div><script type="module" src="/src/public-main.tsx"></script></body>
</html>
