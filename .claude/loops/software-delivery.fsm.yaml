# Canonical machine-readable state machine for the Store OS delivery harness.
# This file is the single source of truth for transitions. LOOPS.md is human
# policy; the workflow executes THIS. Schemas/validators reject an invalid FSM
# before any worker spawns.
#
# Repository reality baked into the commands:
#   - No `npm run verify`, no `npm run lint`, no coverage thresholds exist.
#     Verification uses the real scripts: typecheck, test, build, e2e.
#     NEVER invent a green result or a missing command (docs/LOOPS.md §3).
#   - The design-system gate runs inside `npm run test` (it is a vitest file).
#   - `npm run e2e:firebase` requires the emulator; treat as optional/contextual.
fsm_version: "1.0.0"
description: "Spec-driven multi-agent software delivery FSM for Store OS."

# Concurrency: derived from file ownership, never arbitrary.
concurrency:
  max_parallel_editors: 4            # bounded by .claude/ownership; real cap is overlap, not a number
  review_quorum: 2                   # independent approvals for review gates
  max_retries_per_state: 2           # bounded recovery
  no_progress_threshold: 2           # consecutive attempts w/o measurable progress -> escalate

# Normative retry/failure policy (mirrors LOOPS.md §13).
retry_policy:
  transient_infra:        { retry: true,  max: 2, backoff_ms: 1500, escalate: ESCALATED }
  agent_api_failure:      { retry: true,  max: 2, backoff_ms: 2000, escalate: BLOCKED }
  deterministic_test:     { retry: false, escalate: IMPLEMENTATION, via: senior-implementer }
  implementation_defect:  { retry: false, escalate: IMPLEMENTATION, via: senior-implementer }
  specification_defect:   { retry: false, escalate: HUMAN }
  environmental_mismatch: { retry: false, escalate: BLOCKED }
  permission_failure:     { retry: false, escalate: HUMAN }
  security_violation:     { retry: false, escalate: HUMAN }
  architectural_conflict: { retry: false, escalate: HUMAN }
  unrecoverable_repo:     { retry: false, escalate: FAILED }

states:
  # ─────────────────────────────── INTAKE ───────────────────────────────
  - id: INTAKE
    purpose: "Receive the objective; confirm it is bounded and actionable."
    agent: requirements-analyst
    read_only: true
    worktree: false
    risk: none
    inputs: [objective_text]
    outputs: [intake_record]
    entry_conditions: [objective_text_nonempty]
    exit_conditions: [objective_recorded, run_id_assigned, head_revision_recorded]
    deterministic_commands: []
    review: { required: false }
    allowed_next: [DISCOVERY]
    retry_limit: 0
    timeout_ms: 120000
    on_failure: BLOCKED
    on_escalation: ESCALATED
    evidence_required: [run_manifest, head_sha]

  # ───────────────────────────── DISCOVERY ─────────────────────────────
  - id: DISCOVERY
    purpose: "Establish verified facts about the repo relevant to the objective."
    agent: architecture-planner
    read_only: true
    worktree: false
    risk: none
    inputs: [intake_record]
    outputs: [discovery_report]
    entry_conditions: [INTAKE_passed]
    exit_conditions: [discovery_report_validated, facts_marked_verified_or_inferred]
    deterministic_commands: []
    review: { required: false }
    allowed_next: [REQUIREMENTS_SPEC]
    retry_limit: 1
    timeout_ms: 300000
    on_failure: BLOCKED
    on_escalation: ESCALATED
    evidence_required: [discovery_report]

  # ─────────────────────────── REQUIREMENTS_SPEC ───────────────────────
  - id: REQUIREMENTS_SPEC
    purpose: "Produce a measurable requirements record (objective, scope, acceptance, constraints, failure behavior, security/privacy)."
    agent: requirements-analyst
    read_only: true
    worktree: false
    risk: none
    inputs: [discovery_report]
    outputs: [requirements_doc]
    entry_conditions: [DISCOVERY_passed]
    exit_conditions: [requirements_gate_satisfied]   # see LOOPS.md requirements gate
    deterministic_commands: []
    review: { required: true, quorum: 2, agent: story-reviewer }
    allowed_next: [STORY_DEFINITION]
    retry_limit: 1
    timeout_ms: 300000
    on_failure: BLOCKED
    on_escalation: ESCALATED
    evidence_required: [requirements_doc]

  # ─────────────────────────── STORY_DEFINITION ────────────────────────
  - id: STORY_DEFINITION
    purpose: "Decompose into independently reviewable, bounded stories with observable outcomes."
    agent: requirements-analyst
    read_only: true
    worktree: false
    risk: none
    inputs: [requirements_doc]
    outputs: [stories]
    entry_conditions: [REQUIREMENTS_SPEC_passed]
    exit_conditions: [story_gate_satisfied]
    deterministic_commands: []
    review: { required: true, quorum: 2, agent: story-reviewer }
    allowed_next: [STORY_REVIEW, TEST_DESIGN, ARCHITECTURE_PRECHECK]   # parallel after approval
    retry_limit: 1
    timeout_ms: 300000
    on_failure: BLOCKED
    on_escalation: ESCALATED
    evidence_required: [stories]

  # ───────────────────────────── STORY_REVIEW ──────────────────────────
  - id: STORY_REVIEW
    purpose: "Independently review stories for measurability and traceability."
    agent: story-reviewer
    read_only: true
    worktree: false
    risk: none
    inputs: [stories, requirements_doc]
    outputs: [review_decision]
    entry_conditions: [STORY_DEFINITION_passed]
    exit_conditions: [review_quorum_met, no_blocking_findings]
    deterministic_commands: []
    review: { required: false }   # this IS the review state
    allowed_next: [IMPLEMENTATION_PLAN]
    retry_limit: 1
    timeout_ms: 300000
    on_failure: STORY_DEFINITION   # send back for revision
    on_escalation: ESCALATED
    evidence_required: [review_decision]

  # ───────────────────────────── TEST_DESIGN ───────────────────────────
  - id: TEST_DESIGN
    purpose: "Author Gherkin + QA matrix (happy, validation, authz, boundary, idempotency, concurrency, recovery, observability, regression)."
    agent: gherkin-author        # co-authored with qa-designer
    read_only: true
    worktree: false
    risk: none
    inputs: [stories]
    outputs: [gherkin_scenarios, qa_matrix]
    entry_conditions: [STORY_DEFINITION_passed]
    exit_conditions: [qa_gate_satisfied]
    deterministic_commands: []
    review: { required: true, quorum: 2, agent: qa-designer }
    allowed_next: [IMPLEMENTATION_PLAN]
    retry_limit: 1
    timeout_ms: 300000
    on_failure: BLOCKED
    on_escalation: ESCALATED
    evidence_required: [gherkin_scenarios, qa_matrix]

  # ─────────────────────── ARCHITECTURE_PRECHECK ───────────────────────
  - id: ARCHITECTURE_PRECHECK
    purpose: "Define affected components, data-flow, compatibility, scaling, threat boundaries, migration/rollback."
    agent: architecture-planner
    read_only: true
    worktree: false
    risk: none
    inputs: [stories, discovery_report]
    outputs: [architecture_precheck]
    entry_conditions: [STORY_DEFINITION_passed]
    exit_conditions: [architecture_precheck_gate_satisfied]
    deterministic_commands: []
    review: { required: true, quorum: 2, agent: architecture-reviewer }
    allowed_next: [IMPLEMENTATION_PLAN]
    retry_limit: 1
    timeout_ms: 300000
    on_failure: BLOCKED
    on_escalation: ESCALATED
    evidence_required: [architecture_precheck]

  # ─────────────────────── IMPLEMENTATION_PLAN ─────────────────────────
  - id: IMPLEMENTATION_PLAN
    purpose: "Synthesize reviewed stories, tests, and architecture into an owned, sequenced implementation plan."
    agent: architecture-planner
    read_only: true
    worktree: false
    risk: low
    inputs: [stories, gherkin_scenarios, qa_matrix, architecture_precheck, review_decisions]
    outputs: [implementation_plan]
    entry_conditions: [STORY_REVIEW_passed, TEST_DESIGN_passed, ARCHITECTURE_PRECHECK_passed]
    exit_conditions: [implementation_gate_satisfied, file_ownership_resolved]
    deterministic_commands: []
    review: { required: true, quorum: 2, agent: architecture-reviewer }
    allowed_next: [IMPLEMENTATION]
    retry_limit: 1
    timeout_ms: 300000
    on_failure: BLOCKED
    on_escalation: ESCALATED
    evidence_required: [implementation_plan, ownership_map]

  # ────────────────────────── IMPLEMENTATION ───────────────────────────
  - id: IMPLEMENTATION
    purpose: "Implement owned units. Edits allowed only within the ownership map."
    agent: implementer
    read_only: false
    worktree: true               # editors SHOULD isolate
    risk: medium
    inputs: [implementation_plan, ownership_map, gherkin_scenarios]
    outputs: [code_changes]
    entry_conditions: [IMPLEMENTATION_PLAN_passed, repository_at_expected_revision, no_blocking_questions]
    exit_conditions: [all_units_implemented, no_overlap_violations]
    deterministic_commands: []   # authors code; verification is the next state
    review: { required: false }
    allowed_next: [UNIT_VERIFICATION]
    retry_limit: 2
    timeout_ms: 1800000
    on_failure: IMPLEMENTATION          # recoverable: retry same state
    on_escalation: IMPLEMENTATION       # then senior-implementer (see agent swap)
    evidence_required: [diff, files_touched, ownership_acknowledgement]

  # ──────────────────────── UNIT_VERIFICATION ──────────────────────────
  - id: UNIT_VERIFICATION
    purpose: "Run repo-native deterministic checks: typecheck, unit tests, build."
    agent: qa-executor
    read_only: true
    worktree: false
    risk: none
    inputs: [code_changes, implementation_plan]
    outputs: [verification_record]
    entry_conditions: [IMPLEMENTATION_passed]
    exit_conditions: [verification_gate_satisfied]
    # Real commands for THIS repo. No verify/lint invented.
    deterministic_commands:
      - { id: typecheck, cmd: "npm run typecheck", must_pass: true }
      - { id: unit_tests, cmd: "npm run test",      must_pass: true }   # includes the design-system gate
      - { id: build,      cmd: "npm run build",     must_pass: true }
    review: { required: false }
    allowed_next: [ACCEPTANCE_VERIFICATION]
    retry_limit: 2
    timeout_ms: 600000
    on_failure: IMPLEMENTATION            # deterministic test failure -> fix
    on_escalation: IMPLEMENTATION
    evidence_required: [command_log_with_exit_codes_and_shas, no_invented_success]

  # ────────────────────── ACCEPTANCE_VERIFICATION ──────────────────────
  - id: ACCEPTANCE_VERIFICATION
    purpose: "Run acceptance/e2e against the Gherkin scenarios."
    agent: qa-executor
    read_only: true
    worktree: false
    risk: none
    inputs: [gherkin_scenarios, code_changes]
    outputs: [acceptance_record]
    entry_conditions: [UNIT_VERIFICATION_passed]
    exit_conditions: [acceptance_gate_satisfied]
    deterministic_commands:
      - { id: e2e, cmd: "npm run e2e", must_pass: true }
      # e2e:firebase requires the emulator; optional/contextual — recorded but not hard-required.
      - { id: e2e_firebase, cmd: "npm run e2e:firebase", must_pass: false, contextual: "requires npm run emulators" }
    review: { required: false }
    allowed_next: [CLEANUP]
    retry_limit: 2
    timeout_ms: 900000
    on_failure: IMPLEMENTATION
    on_escalation: IMPLEMENTATION
    evidence_required: [e2e_result, scenario_coverage]

  # ─────────────────────────── CLEANUP ─────────────────────────────────
  - id: CLEANUP
    purpose: "Remove dead code, drive-by artifacts, TODO sprawl; tidy within scope only."
    agent: code-cleaner
    read_only: false
    worktree: true
    risk: low
    inputs: [code_changes, implementation_plan]
    outputs: [cleanup_diff]
    entry_conditions: [ACCEPTANCE_VERIFICATION_passed]
    exit_conditions: [cleanup_done, gates_still_green]
    deterministic_commands:
      - { id: typecheck, cmd: "npm run typecheck", must_pass: true }
      - { id: unit_tests, cmd: "npm run test",      must_pass: true }
    review: { required: false }
    allowed_next: [INDEPENDENT_CODE_REVIEW]
    retry_limit: 1
    timeout_ms: 600000
    on_failure: CLEANUP
    on_escalation: ESCALATED
    evidence_required: [cleanup_diff, re_verification]

  # ────────────────────── INDEPENDENT_CODE_REVIEW ──────────────────────
  - id: INDEPENDENT_CODE_REVIEW
    purpose: "Independent review of the diff against standards + spec. Reviewers must not see each other before independent analysis."
    agent: code-reviewer
    read_only: true
    worktree: false
    risk: none
    inputs: [diff, requirements_doc, gherkin_scenarios]
    outputs: [review_findings]
    entry_conditions: [CLEANUP_passed]
    exit_conditions: [review_gate_satisfied]
    deterministic_commands: []
    review: { required: true, quorum: 2, independent: true }   # distinct reviewer instances
    allowed_next: [SECURITY_HARDENING, QA_EXECUTION, ARCHITECTURE_FINAL_REVIEW]  # parallel
    retry_limit: 1
    timeout_ms: 600000
    on_failure: IMPLEMENTATION          # blocking findings -> fix
    on_escalation: ESCALATED
    evidence_required: [review_findings, dispositions_for_blocking]

  # ──────────────────────── SECURITY_HARDENING ─────────────────────────
  - id: SECURITY_HARDENING
    purpose: "Least-privilege, secret scan, threat-boundary, untrusted-content review. Fail closed if a security gate cannot run."
    agent: security-hardener
    read_only: true
    worktree: false
    risk: none
    inputs: [diff, architecture_precheck]
    outputs: [security_review]
    entry_conditions: [INDEPENDENT_CODE_REVIEW_passed]
    exit_conditions: [security_gate_satisfied]
    deterministic_commands:
      - { id: secret_scan, cmd: "git diff --cached | grep -iE 'secret|password|token|api[_-]?key|bearer' || true", must_pass: true, note: "heuristic; not a substitute for review" }
    review: { required: true, quorum: 2, independent: true }   # distinct security-reviewer instances
    allowed_next: [RELEASE_READINESS]
    retry_limit: 0                      # security violations never auto-retry
    timeout_ms: 600000
    on_failure: ESCALATED
    on_escalation: ESCALATED
    evidence_required: [security_review, secret_scan_result]

  # ─────────────────────────── QA_EXECUTION ────────────────────────────
  - id: QA_EXECUTION
    purpose: "Final QA: full browser-flow validation per docs/LOOPS.md §6 + regression coverage."
    agent: qa-executor
    read_only: true
    worktree: false
    risk: none
    inputs: [gherkin_scenarios, qa_matrix, diff]
    outputs: [qa_report]
    entry_conditions: [INDEPENDENT_CODE_REVIEW_passed]
    exit_conditions: [qa_gate_satisfied]
    deterministic_commands:
      - { id: e2e, cmd: "npm run e2e", must_pass: true }
    review: { required: true, quorum: 2, agent: qa-designer }
    allowed_next: [RELEASE_READINESS]
    retry_limit: 1
    timeout_ms: 900000
    on_failure: IMPLEMENTATION
    on_escalation: ESCALATED
    evidence_required: [qa_report, browser_flow_checklist]

  # ─────────────────── ARCHITECTURE_FINAL_REVIEW ───────────────────────
  - id: ARCHITECTURE_FINAL_REVIEW
    purpose: "Confirm the realized change matches the approved architecture; no scope drift."
    agent: architecture-reviewer
    read_only: true
    worktree: false
    risk: none
    inputs: [architecture_precheck, diff, implementation_plan]
    outputs: [architecture_final_decision]
    entry_conditions: [INDEPENDENT_CODE_REVIEW_passed]
    exit_conditions: [architecture_final_gate_satisfied]
    deterministic_commands: []
    review: { required: true, quorum: 2, independent: true }   # distinct architecture-reviewer instances
    allowed_next: [RELEASE_READINESS]
    retry_limit: 1
    timeout_ms: 600000
    on_failure: IMPLEMENTATION
    on_escalation: ESCALATED
    evidence_required: [architecture_final_decision]

  # ───────────────────────── RELEASE_READINESS ─────────────────────────
  - id: RELEASE_READINESS
    purpose: "Aggregate every mandatory gate at the SAME revision; produce the delivery report."
    agent: evidence-verifier
    read_only: true
    worktree: false
    risk: none
    inputs: [all_state_evidence]
    outputs: [delivery_report, release_decision]
    entry_conditions: [SECURITY_HARDENING_passed, QA_EXECUTION_passed, ARCHITECTURE_FINAL_REVIEW_passed]
    exit_conditions: [release_readiness_gate_satisfied, clean_working_tree_except_intended]
    deterministic_commands:
      - { id: final_typecheck, cmd: "npm run typecheck", must_pass: true }
      - { id: final_tests,     cmd: "npm run test",      must_pass: true }
      - { id: final_build,     cmd: "npm run build",     must_pass: true }
    review: { required: true, quorum: 2, independent: true }   # distinct evidence-verifier instances
    allowed_next: [COMPLETE]
    retry_limit: 0
    timeout_ms: 600000
    on_failure: FAILED
    on_escalation: ESCALATED
    evidence_required: [delivery_report, evidence_manifest, single_revision_attestation]

  # ───────────────────────────── COMPLETE ──────────────────────────────
  - id: COMPLETE
    purpose: "Terminal success. All mandatory gates passed at one revision."
    agent: evidence-verifier
    read_only: true
    worktree: false
    risk: none
    inputs: [release_decision]
    outputs: [final_summary]
    entry_conditions: [RELEASE_READINESS_passed, every_mandatory_gate_passed_same_revision]
    exit_conditions: []
    deterministic_commands: []
    review: { required: false }
    allowed_next: []                    # terminal
    retry_limit: 0
    timeout_ms: 60000
    on_failure: FAILED
    on_escalation: FAILED
    evidence_required: [completion_attestation]

  # ───────────────────────── terminal states ───────────────────────────
  - id: BLOCKED
    purpose: "Missing information or environment; needs input to proceed."
    agent: workflow-simulator   # synthetic; no real worker
    read_only: true
    worktree: false
    risk: none
    inputs: [block_reason]
    outputs: [blocked_report]
    entry_conditions: [any_state_failed_with_missing_info]
    exit_conditions: []
    deterministic_commands: []
    review: { required: false }
    allowed_next: []                    # terminal until a human resumes
    retry_limit: 0
    timeout_ms: 0
    on_failure: BLOCKED
    on_escalation: ESCALATED
    evidence_required: [blocked_report]

  - id: FAILED
    purpose: "Unrecoverable failure; repository left in a known state."
    agent: workflow-simulator
    read_only: true
    worktree: false
    risk: none
    inputs: [failure_reason]
    outputs: [failure_report]
    entry_conditions: [unrecoverable_failure]
    exit_conditions: []
    deterministic_commands: []
    review: { required: false }
    allowed_next: []
    retry_limit: 0
    timeout_ms: 0
    on_failure: FAILED
    on_escalation: FAILED
    evidence_required: [failure_report, known_repo_state]

  - id: ESCALATED
    purpose: "Requires human judgment (policy/product/security/irreversible)."
    agent: workflow-simulator
    read_only: true
    worktree: false
    risk: none
    inputs: [escalation_reason]
    outputs: [escalation_report]
    entry_conditions: [escalation_policy_triggered]
    exit_conditions: []
    deterministic_commands: []
    review: { required: false }
    allowed_next: []
    retry_limit: 0
    timeout_ms: 0
    on_failure: ESCALATED
    on_escalation: ESCALATED
    evidence_required: [escalation_report]

  - id: CANCELLED
    purpose: "Human cancelled the run."
    agent: workflow-simulator
    read_only: true
    worktree: false
    risk: none
    inputs: [cancel_request]
    outputs: [cancel_report]
    entry_conditions: [human_cancel]
    exit_conditions: []
    deterministic_commands: []
    review: { required: false }
    allowed_next: []
    retry_limit: 0
    timeout_ms: 0
    on_failure: CANCELLED
    on_escalation: CANCELLED
    evidence_required: [cancel_report]

# Mandatory states — completion requires ALL of these to have passed.
mandatory_states:
  - REQUIREMENTS_SPEC
  - STORY_DEFINITION
  - STORY_REVIEW
  - TEST_DESIGN
  - ARCHITECTURE_PRECHECK
  - IMPLEMENTATION_PLAN
  - IMPLEMENTATION
  - UNIT_VERIFICATION
  - ACCEPTANCE_VERIFICATION
  - CLEANUP
  - INDEPENDENT_CODE_REVIEW
  - SECURITY_HARDENING
  - QA_EXECUTION
  - ARCHITECTURE_FINAL_REVIEW
  - RELEASE_READINESS

terminal_states: [COMPLETE, BLOCKED, FAILED, ESCALATED, CANCELLED]

# Parallel fan-out groups: dependencies declared, not improvised.
parallel_groups:
  - id: post_story
    trigger: STORY_DEFINITION_passed
    members: [STORY_REVIEW, TEST_DESIGN, ARCHITECTURE_PRECHECK]
    join: IMPLEMENTATION_PLAN        # all members must pass before the join state
  - id: final_reviews
    trigger: INDEPENDENT_CODE_REVIEW_passed
    members: [SECURITY_HARDENING, QA_EXECUTION, ARCHITECTURE_FINAL_REVIEW]
    join: RELEASE_READINESS
